<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Layout check</title>
    <link rel="stylesheet" href="build/assets/app-BNdKYU04.css">
</head>
<body class="app-body">
<div class="app-shell">
    <aside class="app-sidebar">
        <div class="sidebar-brand">Teachers</div>
        <nav class="sidebar-nav">
            <a class="app-nav-link" href="#">Dashboard</a>
            <a class="app-nav-link active" href="#">Messages</a>
        </nav>
    </aside>
    <div class="app-column">
        <header class="app-header">
            <span class="app-header-title">Laravel</span>
            <span class="app-header-user">Teachers001</span>
        </header>
        <main class="app-main" id="main-content">
            <div class="comms-officials-wrap">
                <div class="comms-app" id="commsApp">
                    <div class="comms-shell">
                        <aside class="comms-sidebar" id="commsSidebar">
                            <div class="comms-sidebar-header">
                                <div class="comms-sidebar-title-row"><h1>Messages</h1></div>
                                <button type="button" class="comms-mark-all-read">Mark all as read</button>
                                <div class="comms-search-wrap"><input class="comms-search-input" placeholder="Search people or groups"></div>
                            </div>
                            <div class="comms-conv-list">
                                <div class="comms-conv-item">jerome B</div>
                                <div class="comms-conv-item">Capstone 2</div>
                                <div class="comms-conv-item">testing</div>
                            </div>
                        </aside>
                        <section class="comms-thread" id="commsThread">
                            <div class="comms-thread-empty" id="commsThreadEmpty">
                                <h2>Your messages</h2>
                                <p>Select a conversation or search for a person to start chatting.</p>
                            </div>
                        </section>
                    </div>
                </div>
            </div>
        </main>
        <footer class="app-footer">footer</footer>
    </div>
</div>
</body>
</html>
